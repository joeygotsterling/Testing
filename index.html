<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics Dashboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --good-text: #006300;
    --bad-text: #d03b3b;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --wash: rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --good-text: #0ca30c; --bad-text: #e66767;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --wash: rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --good-text: #0ca30c; --bad-text: #e66767;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --wash: rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  html:has(.viz-root) body { background: #f9f9f7; }
  @media (prefers-color-scheme: dark) { html:where(:not([data-theme="light"])) body { background: #0d0d0d; } }
  html[data-theme="dark"] body { background: #0d0d0d; }
  html[data-theme="light"] body { background: #f9f9f7; }
  .viz-root {
    min-height: 100vh; background: var(--page); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px; max-width: 1200px; margin: 0 auto;
  }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
  .seg button, .btn {
    font: inherit; font-size: 13px; color: var(--text-secondary); background: transparent;
    border: 0; padding: 6px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { color: var(--text-primary); background: var(--wash); font-weight: 600; }
  .btn { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); }
  .seg button:hover, .btn:hover { background: var(--wash); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .tile .label { color: var(--text-secondary); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 650; margin: 4px 0 2px; }
  .delta { font-size: 13px; font-weight: 600; }
  .delta.up { color: var(--good-text); }
  .delta.down { color: var(--bad-text); }
  .delta .vs { color: var(--text-muted); font-weight: 400; }

  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .card h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .card .cap { color: var(--text-secondary); font-size: 13px; margin: 2px 0 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .dl { fill: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); white-space: nowrap; opacity: 0; transition: opacity .08s; z-index: 5;
  }
  .tooltip .t { color: var(--text-secondary); margin-bottom: 4px; }
  .tooltip .r { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .tooltip .r b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tooltip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-secondary); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { max-height: 320px; overflow: auto; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status svg { width: 14px; height: 14px; }
  .hidden { display: none; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <div>
      <h1>Analytics Dashboard</h1>
      <div class="sub" id="rangeLabel"></div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Date range" id="rangeSeg">
        <button data-days="7">7D</button>
        <button data-days="30" aria-pressed="true">30D</button>
        <button data-days="90">90D</button>
      </div>
      <button class="btn" id="themeBtn" aria-label="Toggle theme">◐ Theme</button>
    </div>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="grid2">
    <div class="card">
      <div class="card-head">
        <div>
          <h2>Daily revenue by channel</h2>
          <div class="cap">USD, stacked totals per day</div>
        </div>
        <button class="btn" data-toggle="revenue">Table</button>
      </div>
      <div class="legend" id="revLegend"></div>
      <div class="chart" id="revChart"></div>
      <div class="table-wrap hidden" id="revTable"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <h2>Revenue by channel</h2>
          <div class="cap">Total for selected range</div>
        </div>
        <button class="btn" data-toggle="channel">Table</button>
      </div>
      <div class="chart" id="chanChart"></div>
      <div class="table-wrap hidden" id="chanTable"></div>
    </div>
  </section>

  <section class="card">
    <h2>Recent orders</h2>
    <div class="cap">Latest 8 orders</div>
    <div id="orders"></div>
  </section>

  <footer>Sample data generated in-browser. Replace <code>buildData()</code> with your own source.</footer>
</div>

<script>
(() => {
  // ---------- Sample data (deterministic) ----------
  const CHANNELS = [
    { key: 'web',    name: 'Web',    color: 'var(--series-1)' },
    { key: 'mobile', name: 'Mobile', color: 'var(--series-2)' },
    { key: 'retail', name: 'Retail', color: 'var(--series-3)' },
  ];
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function buildData() {
    const r = rng(42), days = [], today = new Date('2026-11-07');
    for (let i = 179; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const t = 180 - i, wk = [0.85, 1, 1, 1.02, 1.08, 1.2, 0.95][d.getDay()];
      days.push({
        date: d,
        web:    Math.round((5200 + t * 9  + r() * 900) * wk),
        mobile: Math.round((3100 + t * 14 + r() * 700) * wk),
        retail: Math.round((2400 - t * 2  + r() * 600) * wk),
        orders: Math.round((140 + t * 0.4 + r() * 30) * wk),
        visitors: Math.round((4200 + t * 6 + r() * 600) * wk),
      });
    }
    return days;
  }
  const DATA = buildData();
  const fmt$ = v => '$' + (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : v.toFixed(0));
  const fmtN = v => v.toLocaleString('en-US');
  const fmtD = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const total = d => d.web + d.mobile + d.retail;
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(svgNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p / 2) * 2 * p; };

  let days = 30;

  // ---------- KPI tiles ----------
  function renderTiles(cur, prev) {
    const kpis = [
      { label: 'Revenue', f: d => total(d), fmt: fmt$ },
      { label: 'Orders', f: d => d.orders, fmt: fmtN },
      { label: 'Avg. order value', agg: a => sum(a, total) / sum(a, d => d.orders), fmt: v => '$' + v.toFixed(2) },
      { label: 'Conversion rate', agg: a => sum(a, d => d.orders) / sum(a, d => d.visitors) * 100, fmt: v => v.toFixed(2) + '%' },
    ];
    const box = document.getElementById('tiles'); box.innerHTML = '';
    for (const k of kpis) {
      const c = k.agg ? k.agg(cur) : sum(cur, k.f), p = k.agg ? k.agg(prev) : sum(prev, k.f);
      const pct = (c - p) / p * 100, up = pct >= 0;
      const div = document.createElement('div'); div.className = 'card tile';
      div.innerHTML = `<div class="label">${k.label}</div><div class="value">${k.fmt(c)}</div>
        <div class="delta ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}% <span class="vs">vs prior ${days}d</span></div>`;
      box.appendChild(div);
    }
  }

  // ---------- Tooltip helper ----------
  function tooltip(container) {
    const t = document.createElement('div'); t.className = 'tooltip'; container.appendChild(t);
    return {
      show(html, x, y) {
        t.innerHTML = html; t.style.opacity = 1;
        const w = t.offsetWidth, cw = container.clientWidth;
        t.style.left = Math.min(Math.max(x + 12, 0), cw - w) + 'px';
        t.style.top = Math.max(y - t.offsetHeight - 8, 0) + 'px';
      },
      hide() { t.style.opacity = 0; },
    };
  }

  // ---------- Stacked area (line) chart ----------
  function renderRevenue(cur) {
    const box = document.getElementById('revChart'); box.innerHTML = '';
    const W = 720, H = 280, m = { t: 10, r: 12, b: 26, l: 48 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Stacked daily revenue by channel' }, box);
    const max = niceMax(Math.max(...cur.map(total)));
    const x = i => m.l + (cur.length === 1 ? iw / 2 : i / (cur.length - 1) * iw);
    const y = v => m.t + ih - v / max * ih;

    for (let k = 0; k <= 4; k++) {
      const v = max / 4 * k, yy = y(v);
      el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: k ? 'var(--grid)' : 'var(--axis)', 'stroke-width': 1 }, svg);
      el('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end' }, svg).textContent = fmt$(v);
    }
    const step = Math.ceil(cur.length / 6);
    cur.forEach((d, i) => {
      if (i % step === 0 || i === cur.length - 1) {
        if (i !== cur.length - 1 && cur.length - 1 - i < step / 2) return;
        el('text', { x: x(i), y: H - 6, 'text-anchor': 'middle' }, svg).textContent = fmtD(d.date);
      }
    });

    // stacked bands, drawn bottom-up
    let base = cur.map(() => 0);
    CHANNELS.forEach(ch => {
      const top = cur.map((d, i) => base[i] + d[ch.key]);
      const pts = top.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      const back = base.map((v, i) => `${x(i)},${y(v)}`).reverse().join(' ');
      el('polygon', { points: pts + ' ' + back, fill: ch.color, 'fill-opacity': 0.18 }, svg);
      el('polyline', { points: pts, fill: 'none', stroke: ch.color, 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg);
      base = top;
    });

    // hover crosshair
    const cross = el('line', { y1: m.t, y2: m.t + ih, stroke: 'var(--text-muted)', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 }, svg);
    const dots = CHANNELS.map(ch => el('circle', { r: 4, fill: ch.color, stroke: 'var(--surface-1)', 'stroke-width': 2, opacity: 0 }, svg));
    const hit = el('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);
    const tt = tooltip(box);
    const move = ev => {
      const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(cur.length - 1, Math.round((sx - m.l) / iw * (cur.length - 1))));
      const d = cur[i]; let acc = 0;
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', 1);
      CHANNELS.forEach((ch, j) => { acc += d[ch.key]; dots[j].setAttribute('cx', x(i)); dots[j].setAttribute('cy', y(acc)); dots[j].setAttribute('opacity', 1); });
      const rows = [...CHANNELS].reverse().map(ch => `<div class="r"><span><i style="background:${ch.color}"></i>${ch.name}</span><b>${fmt$(d[ch.key])}</b></div>`).join('');
      tt.show(`<div class="t">${fmtD(d.date)}</div>${rows}<div class="r" style="margin-top:4px"><span>Total</span><b>${fmt$(total(d))}</b></div>`,
        x(i) / W * r.width, y(total(d)) / H * r.height);
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => { tt.hide(); cross.setAttribute('opacity', 0); dots.forEach(c => c.setAttribute('opacity', 0)); });

    document.getElementById('revLegend').innerHTML = CHANNELS.map(ch => `<span><i style="background:${ch.color}"></i>${ch.name}</span>`).join('');
    document.getElementById('revTable').innerHTML = `<table><thead><tr><th>Date</th>${CHANNELS.map(c => `<th class="num">${c.name}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${
      [...cur].reverse().map(d => `<tr><td>${fmtD(d.date)}</td>${CHANNELS.map(c => `<td class="num">${fmtN(d[c.key])}</td>`).join('')}<td class="num">${fmtN(total(d))}</td></tr>`).join('')}</tbody></table>`;
  }

  // ---------- Horizontal bar chart ----------
  function renderChannels(cur) {
    const box = document.getElementById('chanChart'); box.innerHTML = '';
    const vals = CHANNELS.map(ch => ({ ...ch, v: sum(cur, d => d[ch.key]) }));
    const all = sum(vals, d => d.v), max = Math.max(...vals.map(d => d.v));
    const W = 360, rowH = 64, H = vals.length * rowH + 8, lw = 0;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Revenue by channel' }, box);
    const tt = tooltip(box);
    vals.forEach((d, i) => {
      const y0 = i * rowH + 8, bw = Math.max(4, d.v / max * (W - 70));
      el('text', { x: lw, y: y0 + 12, class: 'dl', style: 'font-weight:500' }, svg).textContent = d.name;
      el('rect', { x: lw, y: y0 + 22, width: W - 70, height: 18, rx: 4, fill: 'var(--wash)' }, svg);
      el('rect', { x: lw, y: y0 + 22, width: bw, height: 18, rx: 4, fill: d.color }, svg);
      el('text', { x: lw + bw + 8, y: y0 + 35, class: 'dl' }, svg).textContent = fmt$(d.v);
      const hit = el('rect', { x: 0, y: y0, width: W, height: rowH, fill: 'transparent' }, svg);
      hit.addEventListener('pointermove', ev => {
        const r = box.getBoundingClientRect();
        tt.show(`<div class="t">${d.name}</div><div class="r"><span>Revenue</span><b>${fmt$(d.v)}</b></div><div class="r"><span>Share</span><b>${(d.v / all * 100).toFixed(1)}%</b></div>`,
          ev.clientX - r.left, ev.clientY - r.top);
      });
      hit.addEventListener('pointerleave', tt.hide);
    });
    document.getElementById('chanTable').innerHTML = `<table><thead><tr><th>Channel</th><th class="num">Revenue</th><th class="num">Share</th></tr></thead><tbody>${
      vals.map(d => `<tr><td>${d.name}</td><td class="num">${fmtN(d.v)}</td><td class="num">${(d.v / all * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`;
  }

  // ---------- Orders table ----------
  const ICONS = {
    Fulfilled: { color: '#0ca30c', svg: '<circle cx="7" cy="7" r="6" fill="#0ca30c"/><path d="M4 7.2l2 2 4-4.2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>' },
    Pending:   { color: '#fab219', svg: '<circle cx="7" cy="7" r="6" fill="#fab219"/><path d="M7 4v3.4l2 1.2" stroke="#0b0b0b" stroke-width="1.5" fill="none" stroke-linecap="round"/>' },
    Refunded:  { color: '#d03b3b', svg: '<circle cx="7" cy="7" r="6" fill="#d03b3b"/><path d="M4.8 4.8l4.4 4.4M9.2 4.8l-4.4 4.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>' },
  };
  function renderOrders() {
    const r = rng(7), names = ['Ada Lin', 'Ben Okafor', 'Chloe Park', 'Diego Ruiz', 'Esi Mensah', 'Farah Khan', 'Gus Holm', 'Hana Sato'];
    const st = ['Fulfilled', 'Fulfilled', 'Fulfilled', 'Pending', 'Fulfilled', 'Refunded', 'Pending', 'Fulfilled'];
    const rows = names.map((n, i) => ({ id: 10482 - i, n, ch: CHANNELS[Math.floor(r() * 3)].name, amt: 20 + r() * 380, s: st[i], d: DATA[DATA.length - 1 - Math.floor(i / 3)].date }));
    document.getElementById('orders').innerHTML = `<table><thead><tr><th>Order</th><th>Customer</th><th>Channel</th><th>Date</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${
      rows.map(o => `<tr><td>#${o.id}</td><td>${o.n}</td><td>${o.ch}</td><td>${fmtD(o.d)}</td>
        <td><span class="status"><svg viewBox="0 0 14 14" aria-hidden="true">${ICONS[o.s].svg}</svg>${o.s}</span></td>
        <td class="num">$${o.amt.toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
  }

  // ---------- Wiring ----------
  function render() {
    const cur = DATA.slice(-days), prev = DATA.slice(-days * 2, -days);
    document.getElementById('rangeLabel').textContent = `${fmtD(cur[0].date)} – ${fmtD(cur[cur.length - 1].date)}, 2026 · last ${days} days`;
    renderTiles(cur, prev); renderRevenue(cur); renderChannels(cur);
  }
  document.getElementById('rangeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    days = +b.dataset.days;
    document.querySelectorAll('#rangeSeg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.toggle, chart = document.getElementById(k === 'revenue' ? 'revChart' : 'chanChart');
    const table = document.getElementById(k === 'revenue' ? 'revTable' : 'chanTable');
    const showTable = table.classList.contains('hidden');
    table.classList.toggle('hidden', !showTable); chart.classList.toggle('hidden', showTable);
    if (k === 'revenue') document.getElementById('revLegend').classList.toggle('hidden', showTable);
    b.textContent = showTable ? 'Chart' : 'Table';
  }));
  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });
  render(); renderOrders();
})();
</script>
</body>
</html>
